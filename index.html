<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#e8b895">
<title>1 Año y 5 Meses · Para Ti ♡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Dancing+Script:wght@400;600;700&family=Quicksand:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #fbf4ea;
    --cream-warm: #f7e9d7;
    --peach: #f4d8c2;
    --peach-deep: #e8b895;
    --coral: #e6a07a;
    --pink-soft: #f5c5c5;
    --pink-deep: #e8a5a5;
    --rose: #d98a8a;
    --gold: #c9a062;
    --gold-light: #d4af73;
    --brown: #5c3d2e;
    --brown-soft: #8a6852;
    --ink: #3d2820;
    --shadow: rgba(140, 80, 50, 0.18);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Quicksand', sans-serif;
    color: var(--ink);
    background: linear-gradient(180deg,
      #f9e8d4 0%,
      #f4d8c2 20%,
      #f5c5b8 45%,
      #f0bfae 65%,
      #ecb4a0 85%,
      #e6a07a 100%);
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  /* Atmospheric glowing background blobs */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(circle at 15% 20%, rgba(255, 220, 180, 0.6), transparent 40%),
      radial-gradient(circle at 85% 10%, rgba(255, 200, 200, 0.5), transparent 45%),
      radial-gradient(circle at 50% 80%, rgba(255, 180, 160, 0.4), transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  /* Light rays effect */
  body::after {
    content: '';
    position: fixed;
    top: -20%;
    left: -20%;
    width: 60%;
    height: 60%;
    background: radial-gradient(ellipse at center, rgba(255, 230, 190, 0.5) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
    animation: glow 8s ease-in-out infinite;
  }
  @keyframes glow {
    0%, 100% { opacity: 0.6; transform: translate(0, 0); }
    50% { opacity: 0.9; transform: translate(20px, 20px); }
  }

  /* Falling petals canvas */
  #petals {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1;
  }

  /* Music toggle - fixed top-right */
  .music-btn {
    position: fixed;
    top: 18px;
    right: 18px;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: rgba(255, 248, 240, 0.85);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1.5px solid rgba(201, 160, 98, 0.4);
    box-shadow: 0 8px 24px var(--shadow);
    cursor: pointer;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    color: var(--rose);
    transition: transform .3s ease, background .3s ease;
  }
  .music-btn:hover, .music-btn:active { transform: scale(1.08) rotate(8deg); }
  .music-btn.playing { animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 8px 24px var(--shadow), 0 0 0 0 rgba(217, 138, 138, 0.5); }
    50% { box-shadow: 0 8px 24px var(--shadow), 0 0 0 14px rgba(217, 138, 138, 0); }
  }

  main { position: relative; z-index: 2; }

  section {
    padding: 80px 24px;
    max-width: 640px;
    margin: 0 auto;
    position: relative;
  }

  /* ===== HERO ===== */
  .hero {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding-top: 100px;
  }
  .hero-overline {
    font-family: 'Dancing Script', cursive;
    font-size: clamp(22px, 5vw, 30px);
    color: var(--rose);
    margin-bottom: 6px;
    opacity: 0;
    animation: fadeUp 1.2s ease-out 0.3s forwards;
  }
  .hero-title {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-style: italic;
    font-size: clamp(48px, 13vw, 84px);
    line-height: 1;
    color: var(--brown);
    letter-spacing: -0.02em;
    margin-bottom: 8px;
    opacity: 0;
    animation: fadeUp 1.2s ease-out 0.6s forwards;
  }
  .hero-title .num {
    font-style: normal;
    font-weight: 500;
    color: var(--rose);
  }
  .hero-sub {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(18px, 4.5vw, 22px);
    color: var(--brown-soft);
    font-style: italic;
    letter-spacing: 0.04em;
    margin-bottom: 36px;
    opacity: 0;
    animation: fadeUp 1.2s ease-out 0.9s forwards;
  }
  .hero-ornament {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 36px;
    opacity: 0;
    animation: fadeUp 1.2s ease-out 1.1s forwards;
  }
  .hero-ornament .line {
    width: 60px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }
  .hero-ornament .heart {
    color: var(--rose);
    font-size: 14px;
  }

  /* Live counter */
  .counter {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    width: 100%;
    max-width: 420px;
    opacity: 0;
    animation: fadeUp 1.2s ease-out 1.4s forwards;
  }
  .counter-cell {
    background: rgba(255, 248, 240, 0.55);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid rgba(201, 160, 98, 0.25);
    border-radius: 14px;
    padding: 14px 4px;
    text-align: center;
    box-shadow: 0 4px 16px var(--shadow);
  }
  .counter-num {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(26px, 7vw, 36px);
    font-weight: 500;
    color: var(--brown);
    line-height: 1;
    margin-bottom: 4px;
  }
  .counter-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--brown-soft);
  }

  .scroll-hint {
    margin-top: 50px;
    font-family: 'Dancing Script', cursive;
    color: var(--rose);
    font-size: 18px;
    opacity: 0;
    animation: fadeUp 1.2s ease-out 1.8s forwards, bounce 2s ease-in-out 3s infinite;
  }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(8px); }
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ===== Section labels ===== */
  .section-label {
    font-family: 'Dancing Script', cursive;
    font-size: 26px;
    color: var(--rose);
    text-align: center;
    margin-bottom: 6px;
  }
  .section-title {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 400;
    font-size: clamp(30px, 7vw, 44px);
    text-align: center;
    color: var(--brown);
    margin-bottom: 36px;
    line-height: 1.1;
  }

  /* ===== Photo Section ===== */
  .photo-wrap {
    position: relative;
    margin: 0 auto 32px;
    max-width: 380px;
  }
  .photo-frame {
    background: rgba(255, 248, 240, 0.7);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    padding: 14px 14px 50px;
    border-radius: 4px;
    box-shadow:
      0 20px 50px rgba(140, 80, 50, 0.25),
      0 6px 16px rgba(140, 80, 50, 0.15);
    transform: rotate(-1.5deg);
    transition: transform 0.5s ease;
  }
  .photo-frame:hover { transform: rotate(0deg) scale(1.02); }
  .photo-frame img {
    width: 100%;
    display: block;
    border-radius: 2px;
  }
  .photo-caption {
    text-align: center;
    font-family: 'Dancing Script', cursive;
    font-size: 22px;
    color: var(--brown);
    margin-top: 14px;
  }
  .photo-tape {
    position: absolute;
    top: -10px;
    left: 50%;
    transform: translateX(-50%) rotate(-2deg);
    width: 80px;
    height: 22px;
    background: rgba(232, 184, 149, 0.5);
    border-left: 1px dashed rgba(255,255,255,0.5);
    border-right: 1px dashed rgba(255,255,255,0.5);
    z-index: 2;
  }

  .love-letter {
    background: rgba(255, 248, 240, 0.6);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(201, 160, 98, 0.25);
    border-radius: 18px;
    padding: 32px 26px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 18px;
    line-height: 1.7;
    color: var(--ink);
    box-shadow: 0 12px 32px var(--shadow);
    position: relative;
  }
  .love-letter::before {
    content: '"';
    position: absolute;
    top: -10px;
    left: 14px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 80px;
    color: var(--rose);
    opacity: 0.4;
    line-height: 1;
  }
  .love-letter p { margin-bottom: 14px; }
  .love-letter p:last-child { margin-bottom: 0; }
  .love-letter em {
    color: var(--rose);
    font-style: italic;
  }
  .love-letter .signature {
    text-align: right;
    font-family: 'Dancing Script', cursive;
    font-size: 24px;
    color: var(--rose);
    margin-top: 18px;
  }

  /* ===== Reasons cards (flip) ===== */
  .reasons-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
  }
  .reason-card {
    aspect-ratio: 3 / 4;
    perspective: 1000px;
    cursor: pointer;
  }
  .reason-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
    transform-style: preserve-3d;
  }
  .reason-card.flipped .reason-inner {
    transform: rotateY(180deg);
  }
  .reason-front, .reason-back {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 18px;
    box-shadow: 0 8px 24px var(--shadow);
  }
  .reason-front {
    background: linear-gradient(135deg, var(--cream-warm), var(--peach));
    border: 1px solid rgba(201, 160, 98, 0.3);
  }
  .reason-front .num {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 56px;
    color: var(--rose);
    line-height: 1;
  }
  .reason-front .hint {
    position: absolute;
    bottom: 14px;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    color: var(--brown-soft);
  }
  .reason-back {
    background: linear-gradient(135deg, var(--pink-soft), var(--coral));
    transform: rotateY(180deg);
    color: var(--brown);
    font-family: 'Cormorant Garamond', serif;
    font-size: 17px;
    line-height: 1.4;
    font-style: italic;
  }

  /* ===== Hidden hearts game ===== */
  .game-card {
    background: rgba(255, 248, 240, 0.6);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(201, 160, 98, 0.25);
    border-radius: 18px;
    padding: 28px 22px;
    box-shadow: 0 12px 32px var(--shadow);
    text-align: center;
  }
  .game-desc {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 17px;
    color: var(--brown-soft);
    margin-bottom: 20px;
  }
  .hearts-field {
    position: relative;
    height: 280px;
    background: radial-gradient(ellipse at center, rgba(255, 220, 200, 0.4), rgba(232, 184, 149, 0.2));
    border-radius: 14px;
    overflow: hidden;
    border: 1px dashed rgba(201, 160, 98, 0.4);
  }
  .hidden-heart {
    position: absolute;
    width: 30px;
    height: 30px;
    cursor: pointer;
    opacity: 0.15;
    transition: all 0.4s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
  }
  .hidden-heart:hover { opacity: 0.5; transform: scale(1.2); }
  .hidden-heart.found {
    opacity: 1;
    animation: heartFound 0.6s ease-out;
  }
  @keyframes heartFound {
    0% { transform: scale(1); }
    50% { transform: scale(1.8); }
    100% { transform: scale(1.3); }
  }
  .progress-text {
    margin-top: 14px;
    font-family: 'Dancing Script', cursive;
    color: var(--rose);
    font-size: 20px;
  }
  .message-popup {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.8);
    background: linear-gradient(135deg, var(--cream), var(--peach));
    border: 1.5px solid var(--gold);
    border-radius: 20px;
    padding: 30px 26px;
    max-width: 320px;
    width: calc(100% - 40px);
    box-shadow: 0 25px 60px rgba(140, 80, 50, 0.4);
    z-index: 200;
    opacity: 0;
    pointer-events: none;
    transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    text-align: center;
  }
  .message-popup.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
    pointer-events: auto;
  }
  .message-popup .icon {
    font-size: 36px;
    margin-bottom: 10px;
  }
  .message-popup .text {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 19px;
    color: var(--brown);
    line-height: 1.4;
    margin-bottom: 18px;
  }
  .popup-close {
    background: var(--rose);
    color: white;
    border: none;
    padding: 10px 24px;
    border-radius: 30px;
    font-family: 'Quicksand', sans-serif;
    font-weight: 500;
    cursor: pointer;
    letter-spacing: 0.05em;
    box-shadow: 0 4px 12px rgba(217, 138, 138, 0.4);
  }
  .popup-overlay {
    position: fixed;
    inset: 0;
    background: rgba(60, 30, 20, 0.5);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    z-index: 150;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s ease;
  }
  .popup-overlay.show { opacity: 1; pointer-events: auto; }

  /* ===== I love you button ===== */
  .love-button-wrap {
    text-align: center;
  }
  .love-button {
    background: linear-gradient(135deg, var(--rose), var(--coral));
    color: white;
    border: none;
    padding: 18px 36px;
    border-radius: 50px;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 22px;
    cursor: pointer;
    box-shadow: 0 10px 30px rgba(217, 138, 138, 0.4);
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
  }
  .love-button:active { transform: scale(0.95); }
  .love-button:hover { box-shadow: 0 14px 40px rgba(217, 138, 138, 0.55); }
  .love-counter {
    margin-top: 18px;
    font-family: 'Dancing Script', cursive;
    font-size: 22px;
    color: var(--brown);
  }
  .love-counter .count {
    color: var(--rose);
    font-size: 28px;
    font-weight: 700;
  }
  .floating-heart {
    position: absolute;
    pointer-events: none;
    font-size: 24px;
    animation: floatUp 1.5s ease-out forwards;
  }
  @keyframes floatUp {
    0% { opacity: 1; transform: translate(-50%, 0); }
    100% { opacity: 0; transform: translate(calc(-50% + var(--dx, 0)), -120px); }
  }

  /* ===== Final message ===== */
  .final {
    text-align: center;
    padding: 100px 24px 120px;
  }
  .final-title {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 300;
    font-size: clamp(40px, 11vw, 60px);
    color: var(--brown);
    margin-bottom: 14px;
    line-height: 1.1;
  }
  .final-name {
    font-family: 'Dancing Script', cursive;
    font-size: clamp(36px, 10vw, 52px);
    color: var(--rose);
    margin-bottom: 24px;
  }
  .final-line {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 18px;
    color: var(--brown-soft);
    max-width: 380px;
    margin: 0 auto;
    line-height: 1.6;
  }
  .final-flourish {
    margin: 30px auto;
    width: 120px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }
  .final-heart {
    font-size: 48px;
    color: var(--rose);
    margin-top: 30px;
    animation: heartbeat 1.6s ease-in-out infinite;
    display: inline-block;
  }
  @keyframes heartbeat {
    0%, 50%, 100% { transform: scale(1); }
    25%, 75% { transform: scale(1.15); }
  }

  /* Scroll reveal */
  .reveal {
    opacity: 0;
    transform: translateY(30px);
    transition: opacity 1s ease, transform 1s ease;
  }
  .reveal.visible {
    opacity: 1;
    transform: translateY(0);
  }

  /* Decorative flourish */
  .flourish {
    text-align: center;
    margin: 0 0 24px;
    color: var(--gold);
    font-size: 18px;
    letter-spacing: 0.4em;
  }

  @media (max-width: 380px) {
    section { padding: 60px 18px; }
    .counter-cell { padding: 12px 2px; }
    .reasons-grid { gap: 10px; }
    .reason-front .num { font-size: 44px; }
    .reason-back { font-size: 15px; padding: 14px; }
  }
</style>
</head>
<body>

<canvas id="petals"></canvas>

<button class="music-btn" id="musicBtn" aria-label="Reproducir música">♪</button>

<main>

  <!-- HERO -->
  <section class="hero">
    <div class="hero-overline">Para ti, mi amor</div>
    <h1 class="hero-title">
      <span class="num">1</span> año <span style="font-style:normal">y</span> <span class="num">5</span> meses
    </h1>
    <div class="hero-sub">de amarte cada día más</div>
    <div class="hero-ornament">
      <span class="line"></span>
      <span class="heart">♥</span>
      <span class="line"></span>
    </div>

    <div class="counter" id="counter">
      <div class="counter-cell"><div class="counter-num" id="cDays">0</div><div class="counter-label">Días</div></div>
      <div class="counter-cell"><div class="counter-num" id="cHours">0</div><div class="counter-label">Horas</div></div>
      <div class="counter-cell"><div class="counter-num" id="cMins">0</div><div class="counter-label">Min</div></div>
      <div class="counter-cell"><div class="counter-num" id="cSecs">0</div><div class="counter-label">Seg</div></div>
    </div>

    <div class="scroll-hint">desliza para descubrir ↓</div>
  </section>

  <!-- PHOTO -->
  <section class="reveal">
    <div class="flourish">· ❀ ·</div>
    <div class="section-label">Nuestro momento</div>
    <h2 class="section-title">Una imagen,<br>mil sentimientos</h2>

    <div class="photo-wrap">
